<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styleIndex.css">
    <title>Main Page</title>
    <style>
        body {
            background-image: url('background.jpg');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: 100% 100%;
        }
    </style>
</head>
<body>

<h1 style="color:white;">Welcome to Main Page!</h1>
<p style="color:white;">Created by Thanakrit Maidee</p>

<p id="user-email" style="color:white; font-weight: bold;"></p>

<div style="margin: 20px 0;">
    <button id="logout-btn" style="font-size: 20px; background-color: lightcoral; border-radius: 10px; padding: 8px 15px; cursor: pointer; border: none;">Logout</button>
</div>

<button style="font-size: 25px; background-color: lightskyblue; border-radius: 15px; cursor: pointer;">
    <a href="https://www.youtube.com/watch?v=ywthKNqI7uI" target="_blank" style="text-decoration: none; color: black;">Try this!!</a>
</button>
<br><br>

<iframe width="560" height="315"
src="https://www.youtube.com/embed/6RF1Zz5xcNg?si=zUyQFj_PW5525AnS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-cross-origin">
</iframe>

<div class="background-image"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ndyozspwgszeqdlkylct.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tgg7CAGgYngY6HldzjGM0Q_BqlzTe5p';
  
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


  async function checkAuth() {
    const { data: { user } } = await db.auth.getUser();
    if (!user) {
      alert("Please login first!");
      window.location.href = "page2.html"; 
    } else {

      document.getElementById('user-email').innerText = "Logged in as: " + user.email;
    }
  }

  checkAuth();


  document.getElementById('logout-btn').addEventListener('click', async () => {
    const { error } = await db.auth.signOut();
    if (error) {
      alert("Error logging out: " + error.message);
    } else {
      alert("Logged out successfully!");
      window.location.href = "page2.html"; 
    }
  });
</script>

</body>
</html>
