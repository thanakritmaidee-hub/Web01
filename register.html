<!-- 1. Add Supabase CDN library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 2. Initialize Supabase correctly avoiding naming conflicts
  const SUPABASE_URL = 'https://ndyozspwgszeqdlkylct.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tgg7CAGgYngY6HldzjGM0Q_BqlzTe5p';
  
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 3. Attach click event to form submit
  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault(); // Stop standard form redirect

    const username = e.target.username.value;
    const password = e.target.password.value;
    const confirmPassword = e.target.confirm_password.value;

    if (password !== confirmPassword) {
      alert("Passwords do not match!");
      return;
    }

    // Supabase Auth expects an email format
    const email = username.includes('@') ? username : `${username}@domain.com`;

    const { data, error } = await db.auth.signUp({
      email: email,
      password: password,
    });

    if (error) {
      alert("Error creating account: " + error.message);
    } else {
      alert("Account created successfully!");
      window.location.href = "page2.html"; // Redirect to login page
    }
  });
</script>
