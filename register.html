<!-- 1. Add Supabase CDN library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 2. Initialize Supabase with your copied credentials
  const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 3. Attach click event to form submit
  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault(); // Stop standard Flask form redirect

    const username = e.target.username.value;
    const password = e.target.password.value;
    const confirmPassword = e.target.confirm_password.value;

    if (password !== confirmPassword) {
      alert("Passwords do not match!");
      return;
    }

    // Supabase Auth expects an email. You can use username@example.com format or enter real emails
    const email = username.includes('@') ? username : `${username}@domain.com`;

    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password,
    });

    if (error) {
      alert("Error creating account: " + error.message);
    } else {
      alert("Account created successfully!");
      window.location.href = "page2.html"; // Redirect to login page
    }
  });
</script>
