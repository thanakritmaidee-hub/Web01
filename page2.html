<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="register_style.css">
    <title>Login</title>
</head>
<body>

<div class="warpper">
    <!-- ❌ ห้ามมี action="/..." หรือ method="POST" เด็ดขาด ให้ใช้ <form> เปล่าๆ แบบนี้ -->
    <form>
        <h1 style="color:white;">Login</h1>
        <div class="input-box">
            <input type="text" name="username" placeholder="account name" required>
        </div>
        <div class="input-box">
            <input type="password" name="password" placeholder="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
</div>

<!-- Supabase Script สำหรับ Login -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ndyozspwgszeqdlkylct.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tgg7CAGgYngY6HldzjGM0Q_BqlzTe5p';
  
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault(); // ป้องกันไม่ให้ฟอร์มรีหน้าเว็บหรือส่ง POST ไปที่ GitHub

    const username = e.target.username.value;
    const password = e.target.password.value;

    const email = username.includes('@') ? username : `${username}@domain.com`;

    // ใช้คำสั่ง Login ของ Supabase
    const { data, error } = await db.auth.signInWithPassword({
      email: email,
      password: password,
    });

    if (error) {
      alert("Login failed: " + error.message);
    } else {
      alert("Login successful!");
      window.location.href = "main_page.html"; // ล็อกอินผ่านแล้วเด้งไปหน้าหลัก
    }
  });
</script>

</body>
</html>
