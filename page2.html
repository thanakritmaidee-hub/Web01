<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
    <style>
        body {
            background-image: url('background.jpg');
            background-repeat: no-repeat;
            background-attachment: fixed; 
            background-size: 100% 100%;
        }
    </style>
</head>
<body>

<div class="warpper">
    <!-- เพิ่ม id="login-form" เพื่อให้ JavaScript ควบคุมได้แม่นยำ -->
    <form id="login-form">
        <h1 style="color:white;">Login</h1>
        <div class="input-box">
            <input type="text" id="username" name="username" placeholder="Username" required>
        </div>
        <div class="input-box">
            <input type="password" id="password" name="password" placeholder="password" required>
        </div>
        <div class="remeber-forgot">
            <label style="color:white;"><input type="checkbox">remember me</label>
            <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn">Login</button>
        <div class="register-link">
            <p style="color:white;">don't have an account? <a href="register.html">register</a></p>
        </div>
    </form>
</div>

<!-- Supabase Script สำหรับ Login -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ndyozspwgszeqdlkylct.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tgg7CAGgYngY6HldzjGM0Q_BqlzTe5p';
  
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ดักจับการ submit ผ่าน id ของฟอร์มโดยตรง ป้องกัน Error 405 100%
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault(); // ป้องกันไม่ให้เบราว์เซอร์รีเฟรชหรือส่ง POST แบบเก่า

    const usernameInput = document.getElementById('username').value.trim();
    const passwordInput = document.getElementById('password').value.trim();

    // แปลงรูปแบบอีเมลให้ตรงกับตอนสมัครสมาชิก
    const email = usernameInput.includes('@') ? usernameInput : `${usernameInput}@domain.com`;

    console.log("กำลังเข้าสู่ระบบด้วยอีเมล:", email);

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email: email,
        password: passwordInput,
      });

      if (error) {
        console.error("ข้อผิดพลาดจาก Supabase:", error.message);
        alert("Login failed: " + error.message);
      } else {
        console.log("เข้าสู่ระบบสำเร็จ:", data);
        alert("Login successful!");
        window.location.href = "main_page.html"; // พาไปหน้าหลัก
      }
    } catch (err) {
      console.error("เกิดข้อผิดพลาดที่ไม่คาดคิด:", err);
      alert("เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาตรวจสอบ Console (F12)");
    }
  });
</script>

</body>
</html>
